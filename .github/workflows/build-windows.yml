name: Build Windows

# 触发方式：
#  ① 手动：仓库 Actions 页 → 选 "Build Windows" → Run workflow
#  ② 打 tag：推送形如 v0.1.0 的 tag 会自动构建，并把安装包传到对应 Release
on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]      # 推送到 main 自动构建出包
    tags:
      - 'v*'                # 打 tag 额外发布到 Release

permissions:
  contents: write   # 打 tag 时创建 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 缓存内置运行时（Python/ffmpeg/Node），避免每次都重新下载约 100MB+
      - name: 缓存内置运行时
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/python-runtime
            src-tauri/ffmpeg-runtime
            src-tauri/node-runtime
          key: runtimes-windows-${{ hashFiles('requirements.txt', 'src-tauri/scripts/prepare-*.ps1') }}

      - name: 安装前端依赖
        run: npm ci

      # 下载并准备内置 Python / ffmpeg / Node
      - name: 准备内置运行时
        run: npm run prepare:all

      # 诊断：打印各运行时实际大小（用于后续排查 NSIS 体积问题）
      - name: 诊断运行时大小
        run: |
          Write-Host "=== 运行时目录大小 ==="
          if (Test-Path src-tauri\python-runtime\windows) {
            $sz = (Get-ChildItem -Path src-tauri\python-runtime\windows -Recurse -File | Measure-Object -Length -Sum).Sum
            Write-Host "  python-runtime/windows: $([math]::Round($sz/1MB,1)) MB"
          }
          if (Test-Path src-tauri\ffmpeg-runtime\windows) {
            $sz = (Get-ChildItem -Path src-tauri\ffmpeg-runtime\windows -Recurse -File | Measure-Object -Length -Sum).Sum
            Write-Host "  ffmpeg-runtime/windows: $([math]::Round($sz/1MB,1)) MB"
          }
          if (Test-Path src-tauri\node-runtime) {
            $sz = (Get-ChildItem -Path src-tauri\node-runtime -Recurse -File | Measure-Object -Length -Sum).Sum
            Write-Host "  node-runtime: $([math]::Round($sz/1MB,1)) MB"
          }
          $total = 0
          foreach ($dir in @("python-runtime", "ffmpeg-runtime", "node-runtime")) {
            $p = "src-tauri\$dir"
            if (Test-Path $p) {
              $total += (Get-ChildItem -Path $p -Recurse -File | Measure-Object -Length -Sum).Sum
            }
          }
          Write-Host "  以上合计: $([math]::Round($total/1MB,1)) MB"
          Write-Host ""
          Write-Host "=== 预计总资源大小（含 scripts, resources） ==="
          $scriptsSz = (Get-ChildItem -Path scripts -Recurse -File | Measure-Object -Length -Sum).Sum
          $resourcesSz = (Get-ChildItem -Path src-tauri\resources -Recurse -File | Measure-Object -Length -Sum).Sum
          $grandTotal = $total + $scriptsSz + $resourcesSz
          Write-Host "  scripts: $([math]::Round($scriptsSz/1MB,1)) MB"
          Write-Host "  resources: $([math]::Round($resourcesSz/1MB,1)) MB"
          Write-Host "  TOTAL: $([math]::Round($grandTotal/1MB,1)) MB"
          Write-Host ""
          if ($grandTotal -gt 1800MB) {
            Write-Host "⚠️ WARNING: 总资源超过 1.8GB，即将触及 NSIS 2GB mmap 上限！"
          } elseif ($grandTotal -gt 1500MB) {
            Write-Host "⚠️ WARNING: 总资源超过 1.5GB，需要关注 NSIS 上限！"
          } else {
            Write-Host "✅ 总资源在安全范围内"
          }
        shell: pwsh

      # 触发 tauri build：执行 npm run build（vue-tsc 类型检查 + vite 构建），随后 cargo 编译并生成 NSIS(.exe) 安装包
      - name: 打包 Tauri (Windows)
        run: npm run tauri build
        id: tauri-build

      # 失败时上传完整日志到 artifact
      - name: 上传失败日志（debug 用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-failure-logs
          path: |
            src-tauri/target/release/build/autocast-*/output
            src-tauri/target/release/bundle/nsis/*.log
            ${{ runner.temp }}/**/npm-*.log
          if-no-files-found: ignore
          retention-days: 30

      # 把安装包作为工作流产物上传
      - name: 上传安装包 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: autocast-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 仅当是 tag 触发：把安装包发布到 GitHub Release
      - name: 发布到 Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
